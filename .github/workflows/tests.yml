name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU wheels: the CUDA default is ~2 GB heavier and CI has no GPU
      - run: pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test --test-isolation=none tests/test_workflow.cjs
